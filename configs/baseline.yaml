project:
  random_seed: 42

data:
  prepared_path: data/interim/narrative_complaints.csv
  processed_directory: data/processed/classification
  split_report_path: data/processed/classification/split_report.json
  text_column: narrative
  target_column: product
  date_column: date_received
  id_column: complaint_id
  train_path: data/processed/classification/train.csv
  validation_path: data/processed/classification/validation.csv
  test_path: data/processed/classification/test.csv

split:
  train_start: 2023-09-01
  train_end: 2023-12-31
  validation_start: 2024-01-01
  validation_end: 2024-02-29
  test_start: 2024-03-01
  test_end: 2024-03-31

model:
  name: tfidf_logistic_regression
  min_document_frequency: 3
  max_features: 50000
  class_weight: balanced
  ngram_min: 1
  ngram_max: 2
  sublinear_tf: true
  max_iterations: 250
  solver: lbfgs
  candidates:
    - c: 0.5
    - c: 1.0
  artifact_path: models/tfidf_logistic_regression.joblib
  metrics_path: data/processed/classification/baseline_metrics.json
  confusion_matrix_path: reports/figures/baseline_confusion_matrix.png
  evaluation_report_path: data/processed/classification/evaluation_report.json
  calibration_plot_path: reports/figures/baseline_calibration.png

