project:
  random_seed: 42

data:
  train_path: data/processed/classification/train.csv
  validation_path: data/processed/classification/validation.csv
  test_path: data/processed/classification/test.csv
  text_column: narrative
  target_column: product
  id_column: complaint_id
  date_column: date_received
  hash_column: narrative_hash

retrieval:
  vectorizer_model_path: models/tfidf_logistic_regression.joblib
  index_path: models/tfidf_retrieval_index.joblib
  report_path: data/processed/retrieval/retrieval_report.json
  neighbors: 5
  evaluation_queries_per_class: 100
  query_batch_size: 25
  artifact_compression: 3
